packages:
  - protocol
  - packages/*
  - apps/*

# Supply-chain hygiene: don't install versions younger than 24h.
minimumReleaseAge: 1440

# Lifecycle scripts are blocked by default; allow-list only what needs them.
allowBuilds:
  esbuild: true
  simple-git-hooks: true

catalog:
  acorn: ^8.15.0
  # tooling
  '@arethetypeswrong/cli': ^0.18.5
  '@biomejs/biome': ^2.5.14
  '@changesets/cli': ^3.0.3
  '@svitejs/changesets-changelog-github-compact': ^1.2.0
  '@types/node': ^26.0.0
  knip: ^6.38.0
  publint: ^0.3.24
  sherif: ^1.13.0
  simple-git-hooks: ^2.14.0
  size-limit: ^14.0.1
  tsdown: ^0.23.0
  typescript: ^7.0.2
  vitest: ^5.0.2
  # runtime
  '@noble/curves': ^2.4.0
  '@noble/hashes': ^2.4.0
  '@noble/post-quantum': ^0.7.1
  '@scure/base': ^2.4.0
  '@tanstack/query-core': ^5.104.0
  '@tanstack/react-query': ^5.104.0
  '@wallet-standard/app': ^1.1.1
  bn.js: ^5.2.5
  ox: ^1.8.1
  react: ^19.3.0
  react-dom: ^19.3.0
  typebox: ^1.3.34
  zustand: ^5.0.15
