[workspace]
resolver = "3"
members = ["crates/*"]
# Basecamp module crates are standalone (builder convention) and RISC Zero
# guests build with cargo-risczero, so neither joins this workspace.
exclude = ["modules", "programs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/logos-kit/logos-kit"
rust-version = "1.98"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
ureq = { version = "3", features = ["json"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
