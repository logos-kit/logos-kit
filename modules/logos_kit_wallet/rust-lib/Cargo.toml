[package]
name = "logos_kit_wallet"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Standalone crate (builder convention): the empty table keeps cargo from
# adopting the repo-root workspace. S1 switches this module to the
# external-staticlib pattern once it links the LEZ wallet engine.
[workspace]

[lib]
crate-type = ["staticlib"]

# Cargo.lock is committed; the builder feeds it to buildRustPackage.
# Regenerate after dependency changes:
#   nix build github:logos-co/logos-module-builder/<pin>#rust-sdk-src -o logos-rust-sdk-src
#   (cd rust-lib && cargo generate-lockfile)

[dependencies]
serde_json = "1"
logos-rust-sdk = { path = "../logos-rust-sdk-src" }
